name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          ADDF09: ${{ secrets.ADDF09 }}
          BEFE53: ${{ secrets.BEFE53 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('ADDF09', '')
          sec_b = os.environ.get('BEFE53', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 62a8e347ca24c87aa1d66571be78 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 4f26398e2c1ed615450fefa434007eff780c -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
